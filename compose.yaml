services:
  app:
    build: .
    ports:
      - "127.0.0.1:8080:8000"
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
    volumes:
      - exam-data:/app/data
    labels:
      observability.monitor: "true"
      observability.logs: "true"
      observability.service: exam-studio
      observability.environment: local
      observability.team: product
      observability.probe: "true"
      observability.probe-scheme: http
      observability.probe-port: "8000"
      observability.probe-path: /api/health
      observability.os-track: "true"
      observability.os-id: debian
      observability.os-version: "12"
      observability.os-lifecycle-product: debian
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 20s
      timeout: 5s
      retries: 3
volumes:
  exam-data:
